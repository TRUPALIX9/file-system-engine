<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fsa-t fsa-d">
<title id="fsa-t">File System Engine architecture</title>
<desc id="fsa-d">The Electron app has three parts. The React renderer calls the preload bridge's window.fileSystemEngine API; the preload forwards each call over ipcRenderer.invoke to the main process, which validates it with Zod and returns an IpcResult envelope, and pushes devices:updated events back. The main process reaches local disks and volumes through node:fs, keeps an activity log in SQLite with better-sqlite3, reads Finder tags with the macOS mdls, xattr and plutil tools, and talks to an Android phone with the adb CLI through execFile. Shared IPC channels, types and schemas live in src/shared.</desc>
<defs>
<linearGradient id="fsa-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1322"/><stop offset="1" stop-color="#0F1A2E"/></linearGradient>
<marker id="fsa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38BDF8"/></marker>
<marker id="fsa-arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14B8A6"/></marker>
</defs>
<rect width="1280" height="720" fill="url(#fsa-bg)"/>

<g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<text x="48" y="64" font-size="26" font-weight="700" fill="#F8FAFC">File System Engine architecture</text>
<text x="48" y="94" font-size="15" fill="#94A3B8">The main process owns every file, device and database call; the renderer only sees a typed, validated IPC API.</text>

